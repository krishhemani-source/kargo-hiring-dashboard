<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kargo Hiring</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --ink: #161a1f; --muted: #6b7280; --faint: #9aa1ab; --line: #e6e8ec; --hover: #f8f9fb;
    --accent: #2156f3; --accent-soft: #eaf0ff; --good: #11804a; --good-soft: #e6f6ee; --good-line: #b6e3c9;
    --warn: #9a5b00; --warn-soft: #fff5e3; --bad: #b42318; --bad-soft: #fdeceb; --bad-line: #f5c4bf; --chip: #eff1f4;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --ink: #e8eaed; --muted: #9aa1ab; --faint: #6b7280; --line: #262c34; --hover: #1c2128;
      --accent: #6b8cff; --accent-soft: #1c2540; --good: #4cc58a; --good-soft: #12291e; --good-line: #1f4d36;
      --warn: #e0a84a; --warn-soft: #2a2112; --bad: #f2786d; --bad-soft: #2d1716; --bad-line: #5a2a26; --chip: #222830; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--ink); background: var(--chip); }
  select, input[type=text], input[type=password], textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); width: 100%; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  textarea { min-height: 220px; resize: vertical; line-height: 1.55; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--panel); }

  /* top bar */
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.test { background: var(--warn-soft); color: var(--warn); }
  .badge.live { background: var(--bad-soft); color: var(--bad); }
  .stats { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .stat { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .stat b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat.hot b { color: var(--bad); }
  .stat.done b { color: var(--good); }
  .alerts:empty { display: none; }
  .alerts { padding: 10px 20px 0; display: grid; gap: 8px; }
  .alert { padding: 9px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .alert.bad { background: var(--bad-soft); color: var(--bad); }
  .alert.ok { background: var(--good-soft); color: var(--good); }

  /* layout */
  main { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } header { padding: 10px 16px; } .stats { margin-left: 0; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .side { position: sticky; top: 64px; display: grid; gap: 12px; }
  @media (max-width: 900px) { .side { position: static; } }

  /* upload */
  .upload { padding: 12px; display: grid; gap: 8px; }
  .upload .row { display: flex; gap: 8px; align-items: center; }
  .upload select { width: auto; flex: 1; }
  .drop { display: block; border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px; text-align: center; color: var(--muted); cursor: pointer; font-size: 13px; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .upload-results { font-size: 12px; max-height: 120px; overflow: auto; }
  .upload-results:empty { display: none; }

  /* list */
  .list-hd { padding: 10px 12px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
  .seg button { border: none; background: transparent; padding: 4px 12px; border-radius: 6px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .chip span { opacity: .7; margin-left: 3px; font-variant-numeric: tabular-nums; }
  .list { max-height: calc(100vh - 330px); min-height: 200px; overflow: auto; }
  @media (max-width: 900px) { .list { max-height: none; } }
  .item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item .rank { color: var(--faint); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .right { text-align: right; display: grid; gap: 3px; justify-items: end; }
  .fit { font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { width: 56px; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .list-ft { padding: 8px 12px; font-size: 11px; color: var(--faint); display: flex; gap: 10px; flex-wrap: wrap; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .pill.review { background: var(--warn-soft); color: var(--warn); }
  .pill.invite, .pill.pass, .pill.sent { background: var(--good-soft); color: var(--good); }
  .pill.reject { background: var(--chip); color: var(--ink); }
  .pill.failed, .pill.fail { background: var(--bad-soft); color: var(--bad); }
  .pill.wait, .pill.unclear { background: var(--warn-soft); color: var(--warn); }

  /* detail */
  .detail { min-height: 300px; }
  .d-head { padding: 18px 20px; display: flex; gap: 16px; align-items: flex-start; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .d-head h2 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .d-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .d-contact { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  .d-contact span { color: var(--muted); }
  .d-contact b { font-weight: 500; color: var(--ink); }
  .big { margin-left: auto; text-align: right; }
  .big b { display: block; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .big span { font-size: 12px; color: var(--muted); }
  .sec { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: none; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .sec h3 .n { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--panel); display: inline-grid; place-items: center; font-size: 11px; letter-spacing: 0; }
  .sec h3 .n.done { background: var(--good); }
  .sec.dim h3 .n { background: var(--faint); }
  .brief p { margin: 0 0 8px; }
  .brief ol { margin: 6px 0 0 18px; padding: 0; }
  .brief li { margin-bottom: 4px; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary h3 { margin: 0; }
  details > summary h3::before { content: "▸"; font-size: 10px; transition: transform .15s; }
  details[open] > summary h3::before { transform: rotate(90deg); }
  details[open] > summary { margin-bottom: 10px; }
  .crit { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .crit:first-of-type { border-top: none; }
  .crit .name { font-weight: 600; }
  .crit .w { color: var(--faint); font-weight: 400; font-size: 12px; }
  .crit .ev { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .crit .ev q { color: var(--ink); font-style: italic; }
  .dots { letter-spacing: 2px; color: var(--accent); white-space: nowrap; font-size: 12px; }
  .dots .off { color: var(--line); }

  .decide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice { padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; display: grid; gap: 2px; text-align: left; }
  .choice small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .choice.fwd:hover:not(:disabled), .choice.fwd.on { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .choice.pass:hover:not(:disabled), .choice.pass.on { border-color: var(--bad-line); background: var(--bad-soft); color: var(--bad); }
  .choice.on { box-shadow: 0 0 0 1px currentColor; }
  .note { margin-top: 10px; }
  .email-hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .email-hd .kind { font-weight: 600; font-size: 15px; }
  .email-hd select { width: auto; margin-left: auto; font-size: 13px; padding: 5px 8px; }
  .field-label { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .send-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .send-bar .to { font-size: 12px; color: var(--muted); flex: 1; min-width: 180px; }
  .saved { font-size: 12px; color: var(--faint); }
  .sent-box { background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 12px 14px; }
  .sent-box pre { white-space: pre-wrap; font: inherit; color: var(--ink); margin: 10px 0 0; background: var(--panel); border-radius: 8px; padding: 10px 12px; }
  .placeholder { color: var(--muted); font-size: 13px; }
  .events { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .warnlist { margin: 8px 0 0; padding-left: 18px; color: var(--warn); font-size: 12px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #161a1f; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 20; }
  .toast.show { opacity: 1; }
  .login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
  .login[hidden] { display: none; }
  .login-box { width: 100%; max-width: 340px; padding: 22px; }
</style>
</head>
<body>
<header>
  <h1>Kargo Hiring</h1>
  <span id="modeBadge" class="badge">…</span>
  <div class="stats">
    <div class="stat" id="sReview"><b>0</b> to review</div>
    <div class="stat" id="sReady"><b>0</b> ready to send</div>
    <div class="stat" id="sAwait"><b>0</b> haven't heard back</div>
    <div class="stat done" id="sSent"><b>0</b> sent</div>
  </div>
  <button id="btnLogout" class="ghost" hidden>Log out</button>
</header>
<div class="alerts" id="alerts"></div>

<main>
  <aside class="side">
    <div class="card upload">
      <div class="row">
        <select id="role" aria-label="Role applied for">
          <option value="PM">Uploading for: Product Manager</option>
          <option value="SPM">Uploading for: Senior Product Manager</option>
        </select>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="files" accept=".pdf,.docx" multiple hidden>
        <b>Drop CVs here</b> or click to choose · PDF / DOCX, several at once
      </label>
      <div class="upload-results" id="uploadResults"></div>
    </div>

    <div class="card">
      <div class="list-hd">
        <div style="display:flex;gap:8px;align-items:center">
          <div class="seg" id="seg">
            <button data-tab="PM" class="on">PM ranking</button>
            <button data-tab="SPM">SPM ranking</button>
          </div>
          <input type="text" id="search" placeholder="Search" style="flex:1;padding:5px 9px">
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="list" id="list"></div>
      <div class="list-ft"><span><kbd>J</kbd>/<kbd>K</kbd> next / previous</span><span><kbd>F</kbd> move forward</span><span><kbd>P</kbd> pass</span></div>
    </div>
  </aside>

  <section class="card detail" id="detail"><div class="empty">Pick a candidate to review.</div></section>
</main>

<div class="toast" id="toast"></div>
<div id="login" class="login" hidden>
  <form class="card login-box" id="loginForm">
    <h2 style="font-size:16px;margin:0 0 4px">Kargo Hiring</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 14px">Enter the dashboard password.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" style="width:100%;margin-top:10px">Log in</button>
    <div id="loginErr" style="color:var(--bad);font-size:12px;margin-top:8px"></div>
  </form>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CFG = null, TAB = "PM", FILTER = "all", QUERY = "", LIST = [], SEL = null, DETAIL = null, DIRTY = false;
const ROLE_LABEL = { PM: "Product Manager", SPM: "Senior Product Manager" };
const ACTIONABLE = ["scored", "invite_ready", "reject_ready"];
const FILTERS = [
  ["all", "All", () => true],
  ["review", "To review", c => c.status === "scored"],
  ["ready", "Ready to send", c => c.status === "invite_ready" || c.status === "reject_ready"],
  ["sent", "Sent", c => c.status === "sent"],
  ["processing", "Processing", c => c.status === "new"],
  ["failed", "Failed", c => c.status === "failed"],
];

function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...opts });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Please log in"); }
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}
const post = (path, data) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}) });

// ---------------- login ----------------
function showLogin() { $("#login").hidden = false; $("#pw").focus(); clearTimeout(loadList._h); }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try { await post("/api/login", { password: $("#pw").value }); $("#pw").value = ""; $("#login").hidden = true; boot(); }
  catch (err) { $("#loginErr").textContent = err.message; }
});
$("#btnLogout").onclick = async () => { await api("/api/logout", { method: "POST" }); showLogin(); };

// ---------------- config + list ----------------
async function loadConfig() {
  CFG = await api("/api/config");
  const b = $("#modeBadge");
  b.className = "badge " + (CFG.test_mode ? "test" : "live");
  b.textContent = CFG.test_mode ? `Test mode · emails go to ${CFG.founder_email || "(FOUNDER_EMAIL not set)"}` : "Live · emails go to candidates";
  b.title = `Model: ${CFG.model}`;
  const a = [];
  if (!CFG.llm_ready) a.push(`<div class="alert bad">GEMINI_API_KEY is not set, so CVs can't be scored.</div>`);
  if (!CFG.resend_ready) a.push(`<div class="alert">RESEND_API_KEY is not set. You can review and draft, but sending will fail.</div>`);
  if (CFG.test_mode && !CFG.founder_email) a.push(`<div class="alert">Test mode is on but FOUNDER_EMAIL is empty, so test sends have nowhere to go.</div>`);
  $("#alerts").innerHTML = a.join("");
}

async function loadList() {
  const d = await api("/api/candidates");
  LIST = d.candidates;
  const set = (id, n, cls) => { const el = $(id); el.querySelector("b").textContent = n; if (cls) el.className = "stat " + (n ? cls : "done"); };
  set("#sReview", LIST.filter(c => c.status === "scored").length);
  set("#sReady", LIST.filter(c => c.status === "invite_ready" || c.status === "reject_ready").length);
  set("#sAwait", d.counts.awaiting_reply, "hot");
  set("#sSent", d.counts.sent);
  renderList();
  if (SEL && !DIRTY) {
    const c = LIST.find(x => x.id === SEL);
    if (c && DETAIL && (c.status !== DETAIL.status || c.stage !== DETAIL.stage)) loadDetail(SEL);
  }
  pump();
  clearTimeout(loadList._h);
  loadList._h = setTimeout(loadList, d.counts.processing ? 3000 : 15000);
}

const scoreOf = (c, role) => role === "PM" ? c.pm_score : c.spm_score;
const otherRole = r => r === "PM" ? "SPM" : "PM";
const ranked = () => [...LIST].sort((a, b) => (scoreOf(b, TAB) ?? -1) - (scoreOf(a, TAB) ?? -1) || a.id - b.id);

function visible() {
  const f = FILTERS.find(x => x[0] === FILTER)[2], q = QUERY.toLowerCase();
  return ranked().filter(c => f(c) && (!q || `${c.name || ""} ${c.filename} ${c.city || ""}`.toLowerCase().includes(q)));
}

function statusPill(c) {
  if (c.status === "new") return c.stage === "retry"
    ? `<span class="pill wait" title="Retrying automatically">⏳ Gemini busy</span>`
    : `<span class="pill wait"><span class="spin"></span>${esc(c.stage || "queued")}</span>`;
  if (c.status === "sent") return `<span class="pill sent">${c.decision === "invite" ? "Invited" : "Rejected"} ✓</span>`;
  if (c.status === "invite_ready") return `<span class="pill invite">Send invite</span>`;
  if (c.status === "reject_ready") return `<span class="pill reject">Send rejection</span>`;
  if (c.status === "failed") return `<span class="pill failed">Failed</span>`;
  return `<span class="pill review">To review</span>`;
}

function renderList() {
  const chips = FILTERS.map(([id, label, f]) => {
    const n = LIST.filter(f).length;
    if (id !== "all" && !n && FILTER !== id) return "";
    return `<button class="chip ${FILTER === id ? "on" : ""}" data-f="${id}">${label}<span>${n}</span></button>`;
  }).join("");
  $("#chips").innerHTML = chips;
  const rankOf = new Map(); let r = 0;
  ranked().forEach(c => { if (scoreOf(c, TAB) != null) rankOf.set(c.id, ++r); });
  const rows = visible(), other = otherRole(TAB);
  if (!LIST.length) { $("#list").innerHTML = `<div class="empty">No candidates yet. Drop CVs above to start.</div>`; return; }
  if (!rows.length) { $("#list").innerHTML = `<div class="empty">Nothing here.</div>`; return; }
  $("#list").innerHTML = rows.map(c => {
    const s = scoreOf(c, TAB), o = scoreOf(c, other);
    const sub = [`applied ${c.role_applied}`, c.city, o != null ? `${other} ${o.toFixed(0)}%` : ""].filter(Boolean).map(esc).join(" · ");
    const flags = (c.relocation && c.relocation !== "pass" ? ` <span class="pill ${c.relocation}" title="Relocation gate">reloc. ${c.relocation}</span>` : "")
      + (s != null && o != null && o - s >= 10 ? ` <span class="pill" title="Scores notably higher on the ${other} rubric">better as ${other}?</span>` : "")
      + ((c.warnings || []).length ? ` <span title="${esc(c.warnings.join("\n"))}" style="color:var(--warn)">⚠</span>` : "");
    return `<div class="item ${c.id === SEL ? "sel" : ""}" data-id="${c.id}">
      <div class="rank">${rankOf.get(c.id) || "–"}</div>
      <div style="min-width:0"><div class="nm">${esc(c.name || c.filename)}</div><div class="sub">${sub}${flags}</div>
        ${c.status === "failed" ? `<div class="sub" style="color:var(--bad)">${esc(plainError(c.error).slice(0, 90))}</div>` : ""}</div>
      <div class="right">${s != null ? `<span class="fit">${s.toFixed(0)}%</span><div class="bar"><i style="width:${s}%"></i></div>` : ""}${statusPill(c)}</div>
    </div>`;
  }).join("");
  const sel = $(".item.sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
}

$("#list").addEventListener("click", e => { const it = e.target.closest(".item"); if (it) select(+it.dataset.id); });
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b) { FILTER = b.dataset.f; renderList(); } });
$("#search").addEventListener("input", e => { QUERY = e.target.value; renderList(); });
$("#seg").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  TAB = b.dataset.tab; document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
  renderList(); if (DETAIL) renderDetail();
});

async function select(id) {
  if (id === SEL) return;
  await saveDirty();
  SEL = id; renderList(); loadDetail(id);
}
async function loadDetail(id) {
  const fresh = !DETAIL || DETAIL.id !== id;
  DETAIL = await api(`/api/candidates/${id}`);
  if (DETAIL.id !== SEL) return;
  renderDetail();
  if (fresh && $("#detail").getBoundingClientRect().top < 0) window.scrollTo({ top: 0 });
}

function step(delta) {
  const rows = visible(); if (!rows.length) return;
  const i = rows.findIndex(c => c.id === SEL);
  const next = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + delta))];
  if (next) select(next.id);
}
function nextActionable() {
  const rows = ranked(), i = rows.findIndex(c => c.id === SEL);
  return [...rows.slice(i + 1), ...rows.slice(0, i)].find(c => ACTIONABLE.includes(c.status));
}

// ---------------- detail ----------------
// Activity shows what happened, in plain words. Error events stay in the database but aren't shown.
const EVENT_LABEL = {
  uploaded: "Uploaded", extracted: "Details read from CV", scored: "Scored", retry: "Re-scored",
  drafted: "AI drafts written", drafted_from_template: "Drafts started from a template",
  decision: "Decision", draft_edited: "Draft edited", template_used: "Template applied", sent: "Email sent",
};
const TEMPLATE_LABEL = id => Object.values((CFG && CFG.templates) || {}).flat().find(t => t.id === id)?.label;
function activity(events) {
  const out = [];
  for (const e of events || []) {
    if (!EVENT_LABEL[e.action]) continue;
    let detail = e.detail || "";
    if (e.action === "uploaded") detail = detail.replace(/^.* for (PM|SPM)$/, "for $1");
    if (e.action === "extracted") detail = detail === "all details found" ? "" : detail;
    if (e.action === "template_used") detail = TEMPLATE_LABEL(detail.split(": ")[1]) || "";
    if (e.action === "sent") detail = detail.replace(/\s*\(Resend id .*\)$/, "").replace(/^\w+ → /, "to ");
    if (e.action === "draft_edited") detail = detail === "invite" ? "(invite email)" : "(rejection email)";
    if (e.action === "drafted" || e.action === "drafted_from_template" || e.action === "retry") detail = "";
    const prev = out[out.length - 1];
    if (prev && prev.action === e.action && e.action === "draft_edited") { prev.ts = e.ts; continue; }
    out.push({ ...e, detail });
  }
  return out;
}
// Error text for people, not stack traces.
function plainError(msg) {
  msg = String(msg || "");
  if (/template/i.test(msg) && /draft/i.test(msg)) return "Gemini was busy, so these emails start from a standard template. Edit them, or try Rewrite with AI later.";
  if (/re-scored, but new drafts/i.test(msg)) return "Re-scored. The earlier emails were kept.";
  if (/LLMError|LLMBusy|Gemini|\b(429|50[0-4])\b|overloaded|rate.?limit|quota/i.test(msg)) return "Gemini was busy, so this CV couldn't be scored. Try again in a few minutes.";
  if (/very little text/i.test(msg)) return "No readable text in this file (it may be a scanned image). Upload a text PDF or DOCX.";
  return msg.replace(/^[A-Za-z]+(Error|Exception|Leak): /, "").slice(0, 200);
}

const dots = n => `<span class="dots">${"●".repeat(n)}<span class="off">${"●".repeat(5 - n)}</span></span>`;

function renderDetail() {
  const c = DETAIL; if (!c) return;
  const sent = c.status === "sent", scored = !["new", "failed"].includes(c.status);
  const other = otherRole(TAB), pct = scoreOf(c, TAB), otherPct = scoreOf(c, other);
  const det = TAB === "PM" ? c.pm_detail : c.spm_detail, b = c.brief, kind = c.decision;
  const recipient = CFG.test_mode ? `${CFG.founder_email || "FOUNDER_EMAIL"} (test mode, meant for ${c.email || "no email on CV"})` : (c.email || "no email on CV");
  const contact = [
    ["Email", c.email ? esc(c.email) : `<span style="color:var(--bad)">not found</span>`],
    c.phone && ["Phone", esc(c.phone)],
    c.city && ["Location", esc(c.city)],
    ...(c.links || []).map(l => ["Link", `<a href="${esc(/^https?:/.test(l) ? l : "https://" + l)}" target="_blank" rel="noopener">${esc(l.replace(/^https?:\/\/(www\.)?/, ""))}</a>`]),
  ].filter(Boolean).map(([k, v]) => `<div><span>${k}</span> <b>${v}</b></div>`).join("");

  let notice = "";
  if (c.status === "new") notice = `<div class="alert">${c.stage === "retry" ? "⏳ Gemini is busy. Retrying automatically in about a minute." : `<span class="spin"></span> ${esc(c.stage || "queued")}…`}</div>`;
  else if (c.status === "failed") notice = `<div class="alert bad">${esc(plainError(c.error))} <button id="btnRetry" style="margin-left:8px">Try again</button></div>`;
  else if (c.error) notice = `<div class="alert">${esc(plainError(c.error))}</div>`;

  const emailSec = !scored ? "" : sent ? `
    <div class="sec"><h3><span class="n done">2</span> Email sent</h3>
      <div class="sent-box">${kind === "invite" ? "Invite" : "Rejection"} sent ${new Date(c.sent_at).toLocaleString()} to ${esc(c.sent_to)}
        <pre><b>${esc(c.sent_subject)}</b>\n\n${esc(c[kind + "_body"])}</pre></div></div>`
    : !kind ? `
    <div class="sec dim"><h3><span class="n">2</span> Email</h3>
      <div class="placeholder">Choose <b>Move forward</b> or <b>Pass</b> and the matching email appears here, ready to edit and send.</div></div>`
    : `
    <div class="sec"><h3><span class="n">2</span> ${kind === "invite" ? "Invite email" : "Rejection email"}</h3>
      <div class="email-hd">
        <span class="saved" id="saved"></span>
        <select id="tpl" title="Replace this email with a standard template">
          <option value="">Use a template…</option>
          ${((CFG.templates || {})[kind] || []).map(t => `<option value="${esc(t.id)}">${esc(t.label)}</option>`).join("")}
        </select>
        <button class="ghost" id="btnRedraft" title="Ask Gemini for a tailored draft. If it's unavailable, your current draft is kept.">↻ Rewrite with AI</button>
      </div>
      <div class="field-label">Subject</div>
      <input type="text" id="subj" value="${esc(c[kind + "_subject"])}">
      <div class="field-label" style="margin-top:10px">Message</div>
      <textarea id="body">${esc(c[kind + "_body"])}</textarea>
      <div class="send-bar">
        <div class="to">To: ${esc(recipient)}</div>
        <button class="primary" id="btnSend">Send ${kind === "invite" ? "invite" : "rejection"}</button>
      </div>
      ${c.send_error ? `<div class="alert bad" style="margin-top:8px">${esc(c.send_error)}</div>` : ""}
    </div>`;

  $("#detail").innerHTML = `
  <div class="d-head">
    <div style="min-width:0;flex:1">
      <h2>${esc(c.name || c.filename)}</h2>
      <div class="d-meta">Applied for ${ROLE_LABEL[c.role_applied]} · <a href="/api/candidates/${c.id}/file" target="_blank">Open CV ↗</a>
        ${c.relocation ? ` · <span class="pill ${c.relocation}" title="${esc(c.relocation_note)}">Relocation: ${c.relocation}</span>` : ""}</div>
      <div class="d-contact">${contact}</div>
      ${(c.warnings || []).length ? `<ul class="warnlist">${c.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    </div>
    ${pct != null ? `<div class="big"><b>${pct.toFixed(0)}%</b><span>${TAB} fit · ${other} ${otherPct != null ? otherPct.toFixed(0) + "%" : "–"}</span></div>` : ""}
  </div>
  ${notice ? `<div class="sec" style="padding-bottom:0;border:none">${notice}</div>` : ""}

  ${scored ? `
  <div class="sec brief"><h3>Interview brief</h3>
    ${b ? `<p>${esc(b.who)}</p><p><b>Why this rank:</b> ${esc(b.why_ranked)}</p>
      <b>Ask about</b><ol>${b.probes.map(p => `<li>${esc(p)}</li>`).join("")}</ol>`
      : `<div class="placeholder">No AI brief (Gemini was unavailable). The evidence below still applies.</div>`}
  </div>
  <details class="sec" ${kind ? "" : "open"}><summary><h3>Evidence · ${TAB} rubric</h3></summary>
    ${det ? det.criteria.map(x => `<div class="crit"><div class="name">${esc(x.name)} <span class="w">${x.weight}%</span></div><div>${dots(x.score)}</div>
      <div class="ev"><q>${esc(x.evidence)}</q> ${esc(x.reason)}</div></div>`).join("") : `<div class="placeholder">Not scored yet.</div>`}
    <div style="font-size:12px;color:var(--faint);margin-top:8px">Weighted % calculated by the backend · scored by ${esc(c.model || "")} ·
      switch to ${other} ranking to see the ${other} rubric · <button class="ghost" id="btnRescore" style="padding:2px 6px;font-size:12px" ${sent ? "hidden" : ""}>Re-score</button></div>
  </details>

  <div class="sec"><h3><span class="n ${kind ? "done" : ""}">1</span> Decide</h3>
    <div class="decide">
      <button class="choice fwd ${kind === "invite" ? "on" : ""}" id="btnInvite" ${sent ? "disabled" : ""}>✓ Move forward<small>Send an interview invite</small></button>
      <button class="choice pass ${kind === "reject" ? "on" : ""}" id="btnReject" ${sent ? "disabled" : ""}>✕ Pass<small>Send a kind rejection</small></button>
    </div>
    <input type="text" class="note" id="note" maxlength="300" placeholder="Optional note for the record" value="${esc(c.decision_note || "")}" ${sent ? "disabled" : ""}>
  </div>
  ${emailSec}` : ""}

  <details class="sec"><summary><h3>Activity</h3></summary>
    <div class="events">${activity(c.events).map(e => `<div>${new Date(e.ts).toLocaleString()} · <b>${EVENT_LABEL[e.action]}</b> ${esc(e.detail)}</div>`).join("")}</div>
  </details>`;

  const on = (id, fn) => { const x = $("#" + id); if (x) x.onclick = fn; };
  const rescore = async () => { await api(`/api/candidates/${c.id}/retry`, { method: "POST" }); toast("Re-scoring…"); loadList(); loadDetail(c.id); };
  on("btnRetry", rescore);
  on("btnRescore", rescore);
  on("btnInvite", () => decide("invite"));
  on("btnReject", () => decide("reject"));
  on("btnSend", send);
  on("btnRedraft", async () => {
    const btn = $("#btnRedraft"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Rewriting…`;
    await saveDirty();
    try { DETAIL = await api(`/api/candidates/${c.id}/redraft`, { method: "POST" }); toast(DETAIL.error ? "Gemini unavailable. Your draft was kept." : "New AI draft ready"); renderDetail(); }
    catch (e) { toast(e.message, 6000); btn.disabled = false; btn.textContent = "↻ Rewrite with AI"; }
  });
  const tpl = $("#tpl");
  if (tpl) tpl.onchange = async () => {
    const id = tpl.value; if (!id) return;
    if ($("#body").value.trim() && !confirm("Replace this email with the template?")) { tpl.value = ""; return; }
    try { DIRTY = false; DETAIL = await post(`/api/candidates/${c.id}/template`, { template_id: id }); renderDetail(); toast("Template applied"); }
    catch (e) { toast(e.message); tpl.value = ""; }
  };
  ["subj", "body"].forEach(id => { const x = $("#" + id); if (x) { x.oninput = () => { DIRTY = true; $("#saved").textContent = "Unsaved"; }; x.onblur = saveDirty; } });
}

async function decide(d) {
  const c = DETAIL; if (!c || c.status === "sent" || !ACTIONABLE.includes(c.status)) return;
  await saveDirty();
  try {
    DETAIL = await post(`/api/candidates/${c.id}/decision`, { decision: d, note: ($("#note") || {}).value || "" });
    renderDetail(); loadList();
    const subj = $("#subj"); if (subj) subj.closest(".sec").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) { toast(e.message); }
}

async function send() {
  const c = DETAIL;
  await saveDirty();
  const kind = c.decision === "invite" ? "invite" : "rejection";
  const to = CFG.test_mode ? `${CFG.founder_email} (test mode)` : c.email;
  if (!confirm(`Send the ${kind} to ${to}?`)) return;
  const btn = $("#btnSend"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Sending…`;
  try {
    await api(`/api/candidates/${c.id}/send`, { method: "POST" });
    toast(`${kind[0].toUpperCase() + kind.slice(1)} sent ✓`);
    await loadList();
    const next = nextActionable();
    if (next) { SEL = null; select(next.id); } else loadDetail(c.id);
  } catch (e) { toast("Send failed: " + e.message, 6000); loadDetail(c.id); }
}

async function saveDirty() {
  const c = DETAIL, s = $("#subj"), b = $("#body");
  if (!DIRTY || !c || !c.decision || !s || !b) return;
  DIRTY = false;
  try {
    await api(`/api/candidates/${c.id}/draft`, { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: c.decision, subject: s.value, body: b.value }) });
    c[c.decision + "_subject"] = s.value; c[c.decision + "_body"] = b.value;
    const sv = $("#saved"); if (sv) sv.textContent = "Saved";
  } catch (e) { DIRTY = true; toast("Couldn't save the draft: " + e.message); }
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (k === "f") decide("invite");
  else if (k === "p") decide("reject");
});

// ---------------- processing: the browser drives scoring, one request per CV ----------------
const INFLIGHT = new Set(), MAX_PARALLEL = 2;
const age = c => c.claimed_at ? Date.now() - new Date(c.claimed_at).getTime() : Infinity;
function pump() {
  const todo = LIST.filter(c => c.status === "new" && !INFLIGHT.has(c.id)
      && (c.stage === "queued" || (c.stage === "retry" && age(c) > 62e3) || age(c) > 6 * 60e3))
    .sort((a, b) => a.id - b.id);
  while (INFLIGHT.size < MAX_PARALLEL && todo.length) {
    const c = todo.shift();
    INFLIGHT.add(c.id);
    c.stage = "scoring";
    api(`/api/candidates/${c.id}/process`, { method: "POST" })
      .catch(e => { if (!/already being processed/.test(e.message)) toast(`${c.name || c.filename}: ${e.message}`, 6000); })
      .finally(() => { INFLIGHT.delete(c.id); loadList(); });
  }
}
window.addEventListener("beforeunload", e => { if (INFLIGHT.size || DIRTY) { e.preventDefault(); e.returnValue = ""; } });

// ---------------- upload ----------------
const drop = $("#drop"), input = $("#files");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); });
input.addEventListener("change", () => { upload(input.files); input.value = ""; });

async function upload(files) {
  files = [...files];
  if (!files.length) return;
  const role = $("#role").value, out = $("#uploadResults"), lines = [];
  const show = (extra = "") => { out.innerHTML = lines.join("") + extra; };
  // One file per request: keeps each request under hosting body-size limits and isolates failures.
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    show(`<div><span class="spin"></span> Uploading ${i + 1} of ${files.length}…</div>`);
    const fd = new FormData();
    fd.append("role", role);
    fd.append("files", f);
    try {
      const x = (await api("/api/upload", { method: "POST", body: fd })).results[0];
      lines.push(x.error ? `<div style="color:var(--bad)">✕ ${esc(x.filename)}: ${esc(x.error)}</div>`
        : x.duplicate_of ? `<div style="color:var(--warn)">↺ ${esc(x.filename)}: already uploaded (${esc(x.name || "#" + x.duplicate_of)})</div>`
        : `<div style="color:var(--good)">✓ ${esc(x.filename)}: queued</div>`);
    } catch (e) { lines.push(`<div style="color:var(--bad)">✕ ${esc(f.name)}: ${esc(e.message)}</div>`); }
    show();
    if (i % 3 === 2) loadList();  // start scoring while the rest upload
  }
  loadList();
}

async function boot() {
  const s = await api("/api/session");
  $("#btnLogout").hidden = !s.login_required;
  if (!s.logged_in) return showLogin();
  try {
    await loadConfig(); await loadList();
    if (!SEL) { const first = ranked().find(c => ACTIONABLE.includes(c.status)); if (first) select(first.id); }
  } catch (e) { if (e.message !== "Please log in") $("#alerts").innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
}
boot();
</script>
</body>
</html>
